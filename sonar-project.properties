# Análisis de SonarCloud lanzado desde el pipeline (docs/calidad/08-herramienta-sonarcloud.md).
# Reemplaza al análisis automático para poder subir cobertura y aplicar el quality gate.
sonar.organization=romev16
sonar.projectKey=RomeV16_Proyecto-Final---Realfy
sonar.projectName=Proyecto-Final---Realfy

# Se analiza el repositorio completo para que las cifras sean comparables con
# la línea base del análisis automático del 19 de octubre de 2026.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,apps/web/test,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/coverage-modulo/**,apps/api/test/mocks/**
sonar.sourceEncoding=UTF-8

# Cobertura: la suite unitaria completa de la API, la suite del módulo, la de la web y la del paquete compartido.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/api/coverage-modulo/lcov.info,apps/web/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/api/tsconfig.json,apps/web/tsconfig.json,packages/shared/tsconfig.json
