name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Las acciones se fijan por SHA completo (docs/calidad/08-herramienta-sonarcloud.md,
# riesgo R-10): una etiqueta como v4 puede moverse; un SHA no.
#   actions/checkout        v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node      v7.1.0  949feb2413d6458794dcd2491c4babbbce0c15c1
#   pnpm/action-setup       v6.1.0  ea17c68df8912ef543352723c149a84f56e3d413
#   actions/upload-artifact v7.0.2  cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   actions/download-artifact v8.0.2  9000827ccba6bdab643e8b6fd33ac0654aef8333
#   SonarSource/sonarqube-scan-action         v8.3.0  d209202bc7d53ff1cc128f7f907dac145c9d6ae9
#   SonarSource/sonarqube-quality-gate-action v1.2.1  7a5fffe8e523c40e0c740b6bc2712ab503e52efa
#   grafana/setup-k6-action    v1.2.2  43b9fc21641a76002687994433dd586f56e791b1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El paquete compartido y el cliente de Prisma son tipos que el linter resuelve.
      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      # prisma es dependencia declarada del paquete: se invoca la versión del lockfile,
      # no la que npx resolvería al vuelo.
      - name: Generate Prisma client
        run: pnpm --filter @realfy/api exec prisma generate

      - name: Lint
        run: pnpm -r lint

      # tsc sobre los tres paquetes incluyendo los archivos de prueba, que la
      # compilación normal excluye (docs/pruebas.md, "Control de tipos").
      - name: Type check (including tests)
        run: pnpm -r typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @realfy/api exec prisma generate

      - name: Build API
        run: pnpm --filter @realfy/api build

      - name: Build Web
        run: pnpm --filter @realfy/web build

  unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Jest también fija la zona en su globalSetup; acá queda explícita para
    # cualquier comando que corra en este trabajo.
    env:
      TZ: UTC

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @realfy/api exec prisma generate

      # El piso de cobertura global vive en apps/api/jest.config.ts.
      - name: Unit tests with coverage
        run: pnpm --filter @realfy/api test:coverage

      # Suite acotada al módulo de índices y ajustes, con su propio piso
      # (apps/api/jest.modulo.config.ts). Es la que mide el TP de calidad.
      - name: Module tests with coverage (index-data)
        run: pnpm --filter @realfy/api test:modulo

      - name: Shared package tests with coverage
        run: pnpm --filter @realfy/shared test:coverage

      # vitest: funciones puras de lib/ y paridad de claves i18n (CP-72).
      - name: Web tests with coverage
        run: pnpm --filter @realfy/web test:coverage

      # Reporte automático: resumen de cobertura en la página de la ejecución.
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Cobertura"
            echo
            echo "| Suite | Líneas | Ramas | Funciones | Sentencias |"
            echo "|---|---|---|---|---|"
            for pair in "API completa:apps/api/coverage/coverage-summary.json" "Módulo index-data:apps/api/coverage-modulo/coverage-summary.json" "Paquete compartido:packages/shared/coverage/coverage-summary.json" "Web:apps/web/coverage/coverage-summary.json"; do
              name="${pair%%:*}"; file="${pair#*:}"
              if [ -f "$file" ]; then
                node -e '
                  const t = require(process.argv[1]).total;
                  const p = k => t[k].pct.toFixed(2) + " %";
                  console.log(`| ${process.argv[2]} | ${p("lines")} | ${p("branches")} | ${p("functions")} | ${p("statements")} |`);
                ' "$PWD/$file" "$name"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/lcov.info
            apps/api/coverage/lcov-report/
            apps/api/coverage-modulo/lcov.info
            apps/api/coverage-modulo/lcov-report/
            apps/web/coverage/lcov.info
            apps/web/coverage/lcov-report/
            packages/shared/coverage/lcov.info
            packages/shared/coverage/lcov-report/
          retention-days: 14

  sonar:
    name: SonarCloud & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit
    # Los PRs desde forks no reciben el secret; el análisis corre en PRs del repositorio y en main.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historial completo: SonarCloud lo usa para atribuir código nuevo.
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports
          # El artefacto conserva la ruta desde la raíz del repositorio
          # (apps/api/coverage, apps/web/coverage, packages/shared/coverage).
          path: .

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Bloquea el PR si el quality gate falla: bugs nuevos, duplicación o
      # cobertura sobre código nuevo por debajo del umbral.
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  integration-real:
    name: External contract (BCRA / INDEC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @realfy/api exec prisma generate

      # Pega al BCRA y al INDEC reales: verifica que el contrato que el módulo
      # asume siga vigente (docs/calidad/07-integracion-externa.md). Reintenta
      # tres veces por dentro para no confundir una caída transitoria (R-07)
      # con un cambio de contrato.
      - name: Contract tests against real BCRA and INDEC
        run: pnpm --filter @realfy/api test:integracion-real

  smoke-deploy:
    name: Ephemeral deploy, smoke & stress
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit, migrations]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realfy
          POSTGRES_PASSWORD: realfy
          POSTGRES_DB: realfy_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Despliegue efímero: la misma imagen que usa Railway (Dockerfile.api),
      # arrancada con sus migraciones contra una base vacía. Es el despliegue
      # nuevo que el smoke verifica en cada ejecución.
      - name: Build API image
        run: docker build -f Dockerfile.api -t realfy-api:ci .

      - name: Start API container
        run: |
          docker run -d --name realfy-api --network host \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e DATABASE_URL=postgresql://realfy:realfy@localhost:5432/realfy_smoke \
            -e JWT_SECRET=ci-smoke-jwt-secret-0123456789abcdef \
            -e JWT_REFRESH_SECRET=ci-smoke-jwt-refresh-secret-0123456789 \
            -e CORS_ORIGINS=http://localhost:3000 \
            realfy-api:ci

      - name: Wait for /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health | grep -q '"status":"ok"'; then
              echo "API lista tras ${i} intentos"; exit 0
            fi
            sleep 2
          done
          echo "La API no respondió a tiempo"; docker logs realfy-api; exit 1

      - name: "Smoke test (CP-60)"
        run: node apps/api/test/smoke/smoke.mjs --url=http://localhost:3001 --json=smoke-result.json

      - name: Smoke summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Smoke sobre despliegue efímero"
            echo
            node -e '
              const r = require(process.argv[1]);
              console.log(`**${r.passed} pasos ok, ${r.failed} fallidos** — ${r.url} — ${r.at}`);
              console.log(); console.log("| Paso | Resultado | ms |"); console.log("|---|---|---|");
              for (const s of r.steps) console.log(`| ${s.name} | ${s.ok ? "ok" : "FALLO: " + s.detail} | ${s.ms} |`);
            ' "$PWD/smoke-result.json" 2>/dev/null || echo "sin resultado"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: API logs on failure
        if: ${{ failure() }}
        run: docker logs realfy-api

      - name: Upload smoke result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: smoke-result
          path: smoke-result.json
          retention-days: 14

      # ── Stress y esfuerzo sostenido (docs/calidad/10-stress.md) ──────────
      # El límite de 600 peticiones por minuto por IP (RNF-03b) es una decisión
      # de producto y no se puede apagar en producción: para medir el módulo y
      # no el limitador, el mismo contenedor se reinicia fuera de ese modo con
      # el límite apagado, sobre la misma base ya migrada.
      - name: Restart API without rate limit for load tests
        run: |
          docker rm -f realfy-api
          docker run -d --name realfy-api --network host \
            -e NODE_ENV=staging \
            -e RATE_LIMIT_DISABLED=1 \
            -e PORT=3001 \
            -e DATABASE_URL=postgresql://realfy:realfy@localhost:5432/realfy_smoke \
            -e JWT_SECRET=ci-smoke-jwt-secret-0123456789abcdef \
            -e JWT_REFRESH_SECRET=ci-smoke-jwt-refresh-secret-0123456789 \
            -e CORS_ORIGINS=http://localhost:3000 \
            realfy-api:ci
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3001/api/health | grep -q '"status":"ok"' && exit 0
            sleep 2
          done
          docker logs realfy-api; exit 1

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2

      # K6_P95: el umbral de referencia es 500 ms (docs/calidad/10-stress.md);
      # en el runner compartido, con API, base y k6 en la misma máquina, se
      # admite el doble y se publica el valor medido.
      - name: "Stress (CP-70: 50 VU, 2 min)"
        env:
          K6_URL: http://localhost:3001
          K6_P95: "1000"
        run: k6 run --summary-export=k6-stress.json apps/api/test/load/stress.js

      # El esfuerzo sostenido corre al entrar a main: 5 minutos por ejecución
      # son demasiado para cada PR y la medición de referencia (10 minutos)
      # está en docs/calidad/10-stress.md.
      - name: "Soak (CP-71: 10 VU, 5 min)"
        if: ${{ github.event_name == 'push' }}
        env:
          K6_URL: http://localhost:3001
          K6_SOAK: 5m
          K6_P95: "1000"
        run: k6 run --summary-export=k6-soak.json apps/api/test/load/soak.js

      - name: Load summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Carga sobre el despliegue efímero"
            echo
            echo "| Prueba | p95 total | p95 listado | p95 último valor | Errores | Iteraciones |"
            echo "|---|---|---|---|---|---|"
            for pair in "Stress 50 VU:k6-stress.json" "Soak 10 VU:k6-soak.json"; do
              name="${pair%%:*}"; file="${pair#*:}"
              [ -f "$file" ] || continue
              node -e '
                const m = require(process.argv[1]).metrics;
                const p = k => m[k] ? m[k]["p(95)"].toFixed(1) + " ms" : "—";
                const err = m.http_req_failed ? (m.http_req_failed.value * 100).toFixed(2) + " %" : "—";
                console.log(`| ${process.argv[2]} | ${p("http_req_duration")} | ${p("http_req_duration{name:GET /api/index-data}")} | ${p("http_req_duration{name:GET /api/index-data/latest}")} | ${err} | ${m.iterations ? m.iterations.count : "—"} |`);
              ' "$PWD/$file" "$name"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: load-results
          path: |
            k6-stress.json
            k6-soak.json
          if-no-files-found: ignore
          retention-days: 14

  migrations:
    name: Migrations from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realfy
          POSTGRES_PASSWORD: realfy
          POSTGRES_DB: realfy_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://realfy:realfy@localhost:5432/realfy_migrations

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema
        run: pnpm --filter @realfy/api exec prisma validate

      # Una migración con SQL inválido queda registrada como fallida y bloquea
      # todas las siguientes, incluido el despliegue. Aplicarlas sobre una base
      # vacía en cada PR es lo que lo detecta antes de llegar a producción.
      - name: Apply every migration on an empty database
        run: pnpm --filter @realfy/api exec prisma migrate deploy

      - name: Check every migration is applied
        run: pnpm --filter @realfy/api exec prisma migrate status

      # migrate status solo confirma que no quedan migraciones pendientes. Para
      # detectar un cambio de schema.prisma sin su migracion hay que comparar la
      # base migrada contra el esquema: --exit-code devuelve 2 si difieren.
      - name: Check the schema matches the migrations
        run: pnpm --filter @realfy/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  e2e-api:
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: realfy
          POSTGRES_PASSWORD: realfy
          POSTGRES_DB: realfy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realfy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://realfy:realfy@localhost:5432/realfy_e2e
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret
      # Cada caso abre su propia sesión contra el mismo host: con el límite de
      # intentos activo la suite se cortaría sola con 429. El límite estricto de
      # los endpoints de ingreso se verifica en test/unit/credentials-throttle.spec.ts.
      RATE_LIMIT_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: pnpm --filter @realfy/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @realfy/api exec prisma migrate deploy

      - name: API e2e tests
        run: pnpm --filter @realfy/api test:e2e
