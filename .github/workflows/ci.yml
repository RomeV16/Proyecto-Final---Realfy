name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm -r lint

  # ──────────────────────────────────────────────
  # 2. Unit Tests + Coverage Gate (no DB required)
  # ──────────────────────────────────────────────
  unit:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: API unit tests with coverage
        run: pnpm --filter @realfy/api test:coverage
        env:
          # CryptoService requires ARCA_MASTER_KEY even in unit tests (onModuleInit)
          ARCA_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          # Note: ARCA_MOCK is NOT set here — unit tests mock at service level,
          # not at the AfipSDK constructor level. ARCA_MOCK=1 is only for e2e.

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: apps/api/coverage/lcov-report/
          retention-days: 14

  # ──────────────────────────────────────────────
  # 3. API E2E Tests (needs PostgreSQL + Redis)
  # ──────────────────────────────────────────────
  e2e-api:
    name: API E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: realfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/realfy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORTAL_JWT_SECRET: ci-test-portal-secret-not-for-production
      PORTAL_JWT_REFRESH_SECRET: ci-test-portal-refresh-not-for-production
      NODE_ENV: test
      ARCA_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Push schema to test DB
        run: cd apps/api && npx prisma db push --skip-generate --accept-data-loss

      - name: Run API e2e tests
        run: pnpm --filter @realfy/api test:e2e

  # ──────────────────────────────────────────────
  # 4. Playwright Browser E2E Tests
  # ──────────────────────────────────────────────
  e2e-playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: realfy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/realfy_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORTAL_JWT_SECRET: ci-test-portal-secret-not-for-production
      PORTAL_JWT_REFRESH_SECRET: ci-test-portal-refresh-not-for-production
      NODE_ENV: test
      CI: true
      # Use the AfipSDK mock in e2e — no real AFIP credentials needed in CI
      ARCA_MOCK: "1"
      # Dummy master key for envelope encryption in tests (32 bytes base64)
      ARCA_MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build shared package
        run: pnpm --filter @realfy/shared build

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Build API
        run: pnpm --filter @realfy/api build

      - name: Build Web
        run: pnpm --filter @realfy/web build

      - name: Push schema to test DB
        run: cd apps/api && npx prisma db push --skip-generate --accept-data-loss

      - name: Start API server
        run: pnpm --filter @realfy/api start &
        env:
          PORT: 3000

      - name: Start Web server
        run: pnpm --filter @realfy/web start &
        env:
          PORT: 3001

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:3000/health http://localhost:3001 --timeout 60000 || true

      - name: Run Playwright tests
        run: pnpm exec playwright test --project=chromium-admin --reporter=github

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e/test-results/
          retention-days: 14
